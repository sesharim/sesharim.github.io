# Site settings
title: "Software Engineering & AI Development"
tagline: "Agentic development, coding agents, Rails, Go, and verification-driven delivery"
email: lukin.maksim@gmail.com
description: >-
  Practical guides and production case studies on software engineering,
  AI-assisted software development, coding agents, context engineering,
  Ruby on Rails, Go, backend architecture, testing, and
  verification-driven development.
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://lukin.io"
twitter_username: lukin_io
github_username: lukin-io
future: true

author:
  name: Max Lukin
  url: "https://lukin.io/"

social:
  name: lukin.io
  links:
    - "https://www.linkedin.com/in/lukin-io"
    - "https://github.com/lukin-io"
    - "https://twitter.com/lukin_io"

# Build settings
markdown: kramdown
permalink: /blog/:title/

# Exclude files from Jekyll processing
exclude:
  - node_modules
  - package.json
  - package-lock.json
  - tailwind.config.js
  - postcss.config.js
  - assets/css/tailwind.css

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
